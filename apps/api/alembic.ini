# Configuración de Alembic — TraceForge (modo async).
# La URL de la base NO se pone aquí: env.py la toma de TF_DATABASE_URL (config.py),
# para no duplicar secretos ni entornos. Las migraciones las GENERA Claude Code y
# las APLICA el equipo (ver skill migraciones-postgresql).

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# Formato de nombre de archivo de revisión: fecha + slug para orden cronológico.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# sqlalchemy.url se inyecta en env.py desde la configuración de la app.

[post_write_hooks]
# Formatea cada migración generada con ruff (lint-fix + format).
hooks = ruff_check, ruff_format
ruff_check.type = exec
ruff_check.executable = ruff
ruff_check.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
