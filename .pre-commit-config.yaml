# pre-commit — TraceForge
# Instalar (una vez):  uv tool install pre-commit   (o: pipx install pre-commit)
# Activar en el repo:  pre-commit install
# Correr a mano:       pre-commit run --all-files
#
# Los hooks de ruff usan la config de apps/api/pyproject.toml (se descubre por archivo).
# prettier usa apps/web/.prettierrc.json.
repos:
  # ── Backend: ruff (lint + format) ──
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        name: ruff (lint backend)
        args: [--fix]
        files: ^apps/api/.*\.py$
      - id: ruff-format
        name: ruff (format backend)
        files: ^apps/api/.*\.py$

  # ── Frontend: prettier ──
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.3.3
    hooks:
      - id: prettier
        name: prettier (format frontend)
        files: ^apps/web/.*\.(ts|tsx|css|html|json)$
        exclude: ^apps/web/(dist|node_modules)/

  # ── Higiene general ──
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
